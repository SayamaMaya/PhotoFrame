<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推し×本フォトフレーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
            color: black;
            overflow-x: hidden;
            -webkit-touch-callout: none;
        }
        /* カードの外枠 */
        .main-card {
            background-color: white;
            border-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin: 1rem auto;
            padding: 2rem 1.5rem;
            position: relative;
        }
        .frame-overlay {
            pointer-events: none;
            z-index: 10;
        }
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .frame-thumb {
            cursor: pointer;
            border: 2px solid #eee;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .frame-thumb.active { border-color: #000; transform: scale(1.05); }

        .content-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .photo-fixed-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
            flex-shrink: 0;
            background-color: #000;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 2px solid #000;
        }
        
        #final-image {
            -webkit-touch-callout: default;
        }

        /* 8名分の情報スクロールエリア */
        .info-scroll-area {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 10px;
            border-top: 1px solid #f1f1f1;
        }

        /* スクロールバーのデザイン */
        .info-scroll-area::-webkit-scrollbar {
            width: 4px;
        }
        .info-scroll-area::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 10px;
        }

        .model-item {
            padding: 12px 0;
            border-bottom: 1px solid #f8f8f8;
        }
        .model-item:last-child {
            border-bottom: none;
        }

        .recommendation-box {
            background-color: #f9f9f9;
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center p-4">

    <div class="main-card">
        <div class="content-container">
            <h1 class="text-2xl font-bold text-center mb-6 tracking-tighter">さやま まやフォトフレーム</h1>

            <div class="photo-fixed-box">
                <div id="viewfinder" class="absolute inset-0 bg-black overflow-hidden">
                    <video id="video-preview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
                    <img id="frame-preview" class="absolute inset-0 w-full h-full object-contain frame-overlay hidden" src="" alt="">
                    <img id="final-image" class="absolute inset-0 w-full h-full object-cover z-30 hidden" src="" alt="">

                    <div id="start-overlay" class="absolute inset-0 flex items-center justify-center z-50 bg-black">
                        <button type="button" id="start-camera-btn" class="px-8 py-4 border border-white text-white font-bold text-xs tracking-widest uppercase hover:bg-white hover:text-black transition-colors">
                            カメラを起動
                        </button>
                    </div>

                    <div id="loading-overlay" class="absolute inset-0 flex items-center justify-center z-40 bg-white hidden text-xs font-bold uppercase">
                        <div class="flex flex-col items-center gap-3">
                            <div class="loader"></div>
                            <span id="loading-text">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="controls-wrapper" class="w-full flex flex-col space-y-4">
                <div id="frame-selector-section" class="hidden">
                    <div class="flex justify-center gap-4">
                        <div id="thumb-0" class="frame-thumb w-14 h-14 overflow-hidden active flex items-center justify-center bg-gray-50">
                            <img id="img-thumb-0" class="w-full h-full object-contain" src="" alt="A">
                        </div>
                        <div id="thumb-1" class="frame-thumb w-14 h-14 overflow-hidden flex items-center justify-center bg-gray-50">
                            <img id="img-thumb-1" class="w-full h-full object-contain" src="" alt="B">
                        </div>
                    </div>
                </div>

                <div id="capture-section" class="hidden">
                    <button type="button" id="capture-btn" class="w-full py-4 bg-black text-white font-bold rounded-full text-sm hover:opacity-80 transition-opacity">
                        撮影する
                    </button>
                </div>

                <div id="info-section" class="hidden">
                    <p class="text-[10px] font-bold text-neutral-400 px-1">モデル情報（スクロールで表示）</p>
                    <div id="model-list" class="info-scroll-area">
                        </div>
                </div>

                <div id="result-section" class="hidden flex flex-col">
                    <p id="save-instruction" class="text-[10px] font-bold text-center text-neutral-400 mb-4">画像を長押しで保存</p>
                    <div class="flex flex-col space-y-3">
                        <button type="button" id="share-x-btn" class="w-full py-4 bg-black text-white font-bold rounded-full text-sm hover:opacity-80 transition-opacity hidden">
                            Xに投稿する
                        </button>
                        <button type="button" id="retake-btn" class="w-full py-4 border border-black text-black font-bold rounded-full text-sm">
                            撮り直す
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="merge-canvas" class="hidden"></canvas>

    <script>
        // 8名×2セットのデータ構造
        const frameData = [
            {
                url: "https://www.dropbox.com/scl/fi/bc82xu2b1wgq96fi4edov/138_20260227111604.png?rlkey=4eduascd3lwkuuoc7tj6hy5v0&st=2jtuw7at&dl=1",
                models: [
                    { name: "さやま まや", youtube: "https://youtube.com/@sayamamaya", x: "https://x.com/sayama_live", book: "『姑獲鳥の夏』/ 京極夏彦" },
                    { name: "花傘あるみ", youtube: "https://youtube.com/@arumihanagasa", x: "https://x.com/Arumi_Hanagasa", book: "『エッセンシャル思考 最少の時間で成果を最大にする』/グレッグ・マキューン" },
                    { name: "歌与ポメ", youtube: "https://youtube.com/@utayo_pome", x: "https://x.com/pome_utayo", book: "『眠れなくなるほど面白い 図解 カラスの話』/松原始" },
                    { name: "絣華ミタマ", youtube: "https://youtube.com/@henge_mitama", x: "https://x.com/henge_mitama", book: "『ねこいる！』/たなかひかる" },
                    { name: "風見カプラ", youtube: "https://youtube.com/@kapra_kazami", x: "https://x.com/kazami_kapra", book: "『呪われたナターシャ : 現代ロシアにおける呪術の民族誌』/松尾 恒一" },
                    { name: "やすみ", youtube: "https://youtube.com/@yasumi_ch", x: "https://x.com/_Yasumichan_", book: "『ハーモニー』/伊藤 計劃" },
                    { name: "ほのかかのん", youtube: "https://youtube.com/channel/UCrj3vvhicsxH-Q4EbaMJ2iw", x: "https://x.com/honokano_V", book: "『悪役令嬢の中の人～断罪された転生者のため嘘つきヒロインに復讐いたします～』/白梅ナズナ / まきぶろ / 紫真依" },
                    { name: "紫月かなで", youtube: "https://youtube.com/@kanadeshizuki", x: "https://x.com/kanade_shizuki", book: "『アンダー・ユア・ベッド』/大石圭" }
                ]
            },
            {
                url: "https://www.dropbox.com/scl/fi/e0ahqa4s0vev35avnnpnz/Frame2.png?rlkey=xifacveupr1cq6y7z3n2lr4dm&st=2k8g7cj7&dl=0",
                models: [
                    { name: "さやま まや", youtube: "https://youtube.com/@sayamamaya", x: "https://x.com/sayama_live", book: "『姑獲鳥の夏』/ 京極夏彦" },
                    { name: "花傘あるみ", youtube: "https://youtube.com/@arumihanagasa", x: "https://x.com/Arumi_Hanagasa", book: "『エッセンシャル思考 最少の時間で成果を最大にする』/グレッグ・マキューン" },
                    { name: "歌与ポメ", youtube: "https://youtube.com/@utayo_pome", x: "https://x.com/pome_utayo", book: "『眠れなくなるほど面白い 図解 カラスの話』/松原始" },
                    { name: "絣華ミタマ", youtube: "https://youtube.com/@henge_mitama", x: "https://x.com/henge_mitama", book: "『ねこいる！』/たなかひかる" },
                    { name: "風見カプラ", youtube: "https://youtube.com/@kapra_kazami", x: "https://x.com/kazami_kapra", book: "『呪われたナターシャ : 現代ロシアにおける呪術の民族誌』/松尾 恒一" },
                    { name: "やすみ", youtube: "https://youtube.com/@yasumi_ch", x: "https://x.com/_Yasumichan_", book: "『ハーモニー』/伊藤 計劃" },
                    { name: "ほのかかのん", youtube: "https://youtube.com/channel/UCrj3vvhicsxH-Q4EbaMJ2iw", x: "https://x.com/honokano_V", book: "『悪役令嬢の中の人～断罪された転生者のため嘘つきヒロインに復讐いたします～』/白梅ナズナ / まきぶろ / 紫真依" },
                    { name: "紫月かなで", youtube: "https://youtube.com/@kanadeshizuki", x: "https://x.com/kanade_shizuki", book: "『アンダー・ユア・ベッド』/大石圭" }
                ]
            }
        ];

        const video = document.getElementById('video-preview');
        const framePreview = document.getElementById('frame-preview');
        const finalImage = document.getElementById('final-image');
        const startCameraBtn = document.getElementById('start-camera-btn');
        const startOverlay = document.getElementById('start-overlay');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const shareXBtn = document.getElementById('share-x-btn');
        const saveInstruction = document.getElementById('save-instruction');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        
        const frameSelectorSection = document.getElementById('frame-selector-section');
        const infoSection = document.getElementById('info-section');
        const modelList = document.getElementById('model-list');
        const captureSection = document.getElementById('capture-section');
        const resultSection = document.getElementById('result-section');

        let stream = null;
        let frameImg = new Image();
        let isFrameLoaded = false;
        let longPressTimer = null;

        function getProxiedUrl(url) {
            return `https://images.weserv.nl/?url=${encodeURIComponent(url.replace(/dl=[01]/, "raw=1"))}`;
        }

        startCameraBtn.onclick = async () => {
            startOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = "カメラを起動中...";
            
            const success = await initCamera();
            if (success) {
                document.getElementById('img-thumb-0').src = getProxiedUrl(frameData[0].url);
                document.getElementById('img-thumb-1').src = getProxiedUrl(frameData[1].url);
                loadFrame(0);
            } else {
                loadingText.textContent = "背面カメラが見つかりません";
            }
        };

        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { 
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1080 }, 
                        height: { ideal: 1080 } 
                    } 
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" } 
                    });
                } catch (e) {
                    console.error("Camera access failed:", e);
                    return false;
                }
            }

            video.srcObject = stream;
            
            return new Promise((resolve) => {
                video.onloadeddata = () => {
                    video.play().then(() => resolve(true)).catch(() => resolve(false));
                };
                setTimeout(() => resolve(false), 3000);
            });
        }

        function loadFrame(index) {
            isFrameLoaded = false;
            const data = frameData[index];
            const proxiedUrl = getProxiedUrl(data.url);
            
            // モデルリストを生成
            modelList.innerHTML = '';
            data.models.forEach(m => {
                const item = document.createElement('div');
                item.className = 'model-item';
                item.innerHTML = `
                    <div class="text-left text-[11px] font-medium text-neutral-600 mb-2">
                        フレームモデル：<span class="font-bold text-black">${m.name}</span>
                    </div>
                    <div class="flex flex-row gap-2">
                        <a href="${m.youtube}" target="_blank" class="flex-1 py-2 bg-white border border-gray-200 text-gray-700 font-bold rounded-full text-[10px] flex items-center justify-center gap-1 shadow-sm hover:bg-gray-50 transition-colors">
                            <span class="text-[#ff4d4d]">●</span> YouTube 登録
                        </a>
                        <a href="${m.x}" target="_blank" class="flex-1 py-2 bg-white border border-gray-200 text-gray-700 font-bold rounded-full text-[10px] flex items-center justify-center gap-1 shadow-sm hover:bg-gray-50 transition-colors">
                            <span class="text-black">●</span> X フォロー
                        </a>
                    </div>
                    <div class="recommendation-box">
                        <p class="text-[9px] font-bold text-neutral-500 mb-1">私の推し本はコレ！</p>
                        <p class="text-[11px] font-bold text-neutral-800 leading-snug">${m.book}</p>
                    </div>
                `;
                modelList.appendChild(item);
            });

            frameImg = new Image();
            frameImg.crossOrigin = "anonymous";
            frameImg.onload = () => {
                framePreview.src = proxiedUrl;
                isFrameLoaded = true;
                loadingOverlay.classList.add('hidden');
                framePreview.classList.remove('hidden');
                frameSelectorSection.classList.remove('hidden');
                infoSection.classList.remove('hidden');
                captureSection.classList.remove('hidden');
            };
            frameImg.src = proxiedUrl;
        }

        document.getElementById('thumb-0').onclick = () => { setActiveThumb(0); loadFrame(0); };
        document.getElementById('thumb-1').onclick = () => { setActiveThumb(1); loadFrame(1); };

        function setActiveThumb(index) {
            document.querySelectorAll('.frame-thumb').forEach((el, i) => {
                if(i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        captureBtn.onclick = () => {
            const canvas = document.getElementById('merge-canvas');
            const ctx = canvas.getContext('2d');
            const size = 1080;
            canvas.width = size;
            canvas.height = size;

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, size, size);

            const vW = video.videoWidth;
            const vH = video.videoHeight;
            const min = Math.min(vW, vH);
            ctx.drawImage(video, (vW - min) / 2, (vH - min) / 2, min, min, 0, 0, size, size);

            if (isFrameLoaded) {
                ctx.drawImage(frameImg, 0, 0, size, size);
            }

            finalImage.src = canvas.toDataURL('image/jpeg', 0.9);
            finalImage.classList.remove('hidden');
            
            shareXBtn.classList.add('hidden');
            saveInstruction.textContent = "画像を長押しで保存";
            
            resultSection.classList.remove('hidden');
            frameSelectorSection.classList.add('hidden');
            infoSection.classList.add('hidden');
            captureSection.classList.add('hidden');
            video.classList.add('hidden');
            framePreview.classList.add('hidden');
        };

        const startLongPress = () => {
            longPressTimer = setTimeout(() => {
                shareXBtn.classList.remove('hidden');
                saveInstruction.textContent = "保存した画像はXに投稿できます。";
            }, 800);
        };

        const cancelLongPress = () => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        };

        finalImage.addEventListener('touchstart', startLongPress);
        finalImage.addEventListener('touchend', cancelLongPress);
        finalImage.addEventListener('touchmove', cancelLongPress);
        finalImage.addEventListener('mousedown', startLongPress);
        finalImage.addEventListener('mouseup', cancelLongPress);
        finalImage.addEventListener('mouseleave', cancelLongPress);

        shareXBtn.onclick = () => {
            const text = encodeURIComponent("さやま まや フォトフレームで撮影しました！ #さやままや #フォトフレーム");
            const url = "https://twitter.com/intent/tweet?text=" + text;
            window.open(url, '_blank');
        };

        retakeBtn.onclick = () => {
            finalImage.classList.add('hidden');
            resultSection.classList.add('hidden');
            frameSelectorSection.classList.remove('hidden');
            infoSection.classList.remove('hidden');
            captureSection.classList.remove('hidden');
            framePreview.classList.remove('hidden');
            video.classList.remove('hidden');
        };
    </script>
</body>
</html>
